# Veröffentlicht den kostenlosen Bomber-Arena-Relay (Cloudflare Worker). Manuell starten: Actions -> "Bomber-Relay veröffentlichen" -> Run workflow.
# Benötigt die Repository-Secrets CLOUDFLARE_API_TOKEN und CLOUDFLARE_ACCOUNT_ID (siehe relay/README.md).
name: Bomber-Relay veröffentlichen
on:
  workflow_dispatch:
  push:
    branches: [test]
    paths: ['relay/**']
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Zugangsdaten prüfen
        env:
          T: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          A: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$T" ] || [ -z "$A" ]; then echo "::error::Secrets CLOUDFLARE_API_TOKEN und CLOUDFLARE_ACCOUNT_ID fehlen (Settings > Secrets and variables > Actions > Repository secrets). Anleitung: relay/README.md"; exit 1; fi
      - uses: cloudflare/wrangler-action@v3
        with:
          wranglerVersion: "4"
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: relay
          command: deploy
